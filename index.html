    body::before {
      content: '';
      position: fixed; inset: 0;
      background: rgba(2, 10, 3, 0.87);
      backdrop-filter: blur(3px);
      z-index: 0;
    }

    .page {
      width: 100%; max-width: 420px;
      position: relative; z-index: 1;
    }

    .card {
      background: rgba(4, 16, 6, 0.88);
      border: 1px solid rgba(0,200,83,0.2);
      border-radius: 22px;
      padding: 20px 22px 16px;
      box-shadow:
        0 0 60px rgba(0,200,83,0.08),
        0 20px 60px rgba(0,0,0,0.6);
      backdrop-filter: blur(16px);
    }

    .head {
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
      margin-bottom: 14px;
    }

    .logo-ring {
      position: relative; margin-bottom: 8px;
    }
    .logo-ring::before {
      content: '';
      position: absolute; inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--p1), var(--p2));
      box-shadow: 0 0 20px rgba(0,230,118,0.5);
      z-index: 0;
    }
    .logo-ring img {
      position: relative; z-index: 1;
      width: 72px; height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--bg);
      display: block;
    }
    .logo-fallback {
      position: relative; z-index: 1;
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--p1), var(--p2));
      border: 3px solid var(--bg);
      display: none; align-items: center; justify-content: center;
      font-size: 1.8rem;
    }

    .store-name {
      font-size: 1.4rem; font-weight: 800; letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ccffdd 0%, #00e676 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 3px;
    }
    .store-sub {
      font-size: 0.74rem; color: var(--muted);
      margin-bottom: 8px;
    }

    .services {
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
      margin-bottom: 10px;
    }
    .stag {
      font-size: 0.7rem; font-weight: 600;
      padding: 3px 9px; border-radius: 20px; border: 1px solid;
    }
    .stag-tt { background: rgba(254,44,85,0.1);  color: #fe2c55; border-color: rgba(254,44,85,0.25); }
    .stag-pg { background: rgba(234,179,8,0.1);  color: #eab308; border-color: rgba(234,179,8,0.25); }
    .stag-it { background: rgba(249,115,22,0.1); color: #fb923c; border-color: rgba(249,115,22,0.25); }

    .avg-box {
      width: 100%;
      background: linear-gradient(135deg, rgba(0,200,83,0.1), rgba(0,230,118,0.06));
      border: 1px solid rgba(0,200,83,0.22);
      border-radius: 12px;
      padding: 9px 16px;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .avg-lbl { font-size: 0.78rem; color: var(--muted); }
    .avg-val {
      font-size: 1.1rem; font-weight: 800;
      background: linear-gradient(135deg, #69f0ae, #00e676);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .calc { margin-top: 12px; }
    .field { margin-bottom: 10px; }
    .field-lbl {
      font-size: 0.76rem; font-weight: 600;
      color: var(--muted); margin-bottom: 5px;
      display: flex; align-items: center; gap: 5px;
    }

    .big-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1.45rem; font-weight: 700;
      color: var(--text);
      outline: none; direction: ltr; text-align: left;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .big-input:focus {
      border-color: var(--p1);
      background: rgba(0,200,83,0.05);
      box-shadow: 0 0 0 3px rgba(0,200,83,0.12);
    }
    .big-input::placeholder { color: rgba(74,112,80,0.5); font-weight: 400; font-size: 1rem; }
    .big-input::-webkit-inner-spin-button,
    .big-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .big-input[type=number] { -moz-appearance: textfield; }

    .divider {
      display: flex; align-items: center; justify-content: center;
      margin: 6px 0;
    }
    .divider-icon {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, rgba(0,200,83,0.12), rgba(0,230,118,0.07));
      border: 1px solid rgba(0,200,83,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; color: #00e676;
    }

    .btn-manage {
      margin-top: 12px; width: 100%;
      background: linear-gradient(135deg, #00a844 0%, #00e676 100%);
      color: #021a08; border: none; border-radius: 12px;
      padding: 13px; font-size: 0.95rem; font-weight: 800;
      font-family: inherit; cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,200,83,0.35);
      transition: all .2s;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .btn-manage:hover { transform: translateY(-1px); box-shadow: 0 6px 26px rgba(0,200,83,0.45); }
    .btn-manage:active { transform: translateY(0); }

    .socials {
      display: flex; gap: 8px; justify-content: center;
      margin-top: 14px; padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .sc {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      transition: transform .2s, opacity .2s;
      border: 1px solid transparent;
    }
    .sc:hover { transform: translateY(-2px); opacity: 0.85; }
    .sc-fb { background: rgba(24,119,242,0.15); border-color: rgba(24,119,242,0.25); color: #4a90d9; }
    .sc-ig { background: rgba(225,48,108,0.12); border-color: rgba(225,48,108,0.25); color: #e1306c; }
    .sc-tg { background: rgba(0,136,204,0.12);  border-color: rgba(0,136,204,0.25);  color: #29b6f6; }
    .sc-wa { background: rgba(37,211,102,0.12); border-color: rgba(37,211,102,0.25); color: #25d366; }
    .sc-tt { background: rgba(254,44,85,0.12);  border-color: rgba(254,44,85,0.25);  color: #fe2c55; }

    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(2, 8, 3, 0.85);
      backdrop-filter: blur(10px);
      z-index: 999;
      align-items: center; justify-content: center;
      padding: 16px;
    }
    .overlay.on { display: flex; }

    .modal {
      background: rgba(4, 16, 6, 0.97);
      border: 1px solid rgba(0,200,83,0.2);
      border-radius: 20px;
      width: 100%; max-width: 440px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 50px rgba(0,200,83,0.07);
    }

    .modal-header {
      padding: 20px 22px 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title {
      font-size: 1rem; font-weight: 700;
      display: flex; align-items: center; gap: 7px;
    }
    .modal-close {
      width: 30px; height: 30px; border-radius: 8px;
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; transition: background .2s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    .modal-body { padding: 18px 22px 22px; }

    .otp-hint { font-size: 0.8rem; color: var(--muted); margin-bottom: 14px; text-align: center; }
    .otp-boxes {
      display: flex; gap: 7px; justify-content: center;
      margin-bottom: 18px; direction: ltr;
    }
    .otp-box {
      width: 46px; height: 54px;
      text-align: center; font-size: 1.6rem; font-weight: 800;
      background: rgba(255,255,255,0.04);
      border: 2px solid rgba(255,255,255,0.09);
      border-radius: 11px; color: var(--text); outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .otp-box:focus { border-color: var(--p1); background: rgba(0,200,83,0.07); box-shadow: 0 0 0 3px rgba(0,200,83,0.16); }
    .otp-box.has-val { border-color: rgba(0,200,83,0.45); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border: none; border-radius: 10px; font-size: 0.9rem; font-family: inherit; font-weight: 600; cursor: pointer; transition: all .2s; }
    .btn-row { display: flex; gap: 9px; }
    .btn-row .btn { flex: 1; }
    .btn-ghost { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    .btn-primary { background: linear-gradient(135deg, #00a844, #00e676); color: #021a08; box-shadow: 0 4px 14px rgba(0,200,83,0.3); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,200,83,0.4); }
    .btn-green  { background: var(--green); color: #052e16; }
    .btn-green:hover { background: #00b25a; }
    .btn-red    { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }
    .btn-red:hover { background: rgba(239,68,68,0.22); }
    .btn-sm     { padding: 5px 9px; font-size: 0.78rem; border-radius: 7px; }
    .btn-full   { width: 100%; }

    .admin-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .admin-head .modal-title { font-size: 0.95rem; }

    .tbl-wrap { border: 1px solid var(--border); border-radius: 11px; overflow: hidden; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th { background: rgba(0,200,83,0.05); color: var(--muted); font-weight: 600; padding: 9px 11px; text-align: right; border-bottom: 1px solid var(--border); font-size: 0.76rem; }
    td { padding: 9px 11px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(0,200,83,0.02); }
    .acts { display: flex; gap: 5px; }
    .empty { text-align: center; padding: 24px; color: var(--muted); font-size: 0.83rem; }

    .edit-in { background: rgba(0,200,83,0.08); border: 1.5px solid var(--p1); border-radius: 7px; color: var(--text); padding: 4px 7px; font-size: 0.84rem; width: 84px; outline: none; direction: ltr; text-align: center; }
    .edit-in::-webkit-inner-spin-button, .edit-in::-webkit-outer-spin-button { -webkit-appearance: none; }
    .edit-in[type=number] { -moz-appearance: textfield; }

    .add-box { background: rgba(0,200,83,0.03); border: 1px solid var(--border); border-radius: 11px; padding: 14px; }
    .add-title { font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 9px; overflow: hidden; }
    .form-fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; overflow: hidden; }
    .form-fld label { font-size: 0.74rem; color: var(--muted); font-weight: 600; }
    .form-in { background: rgba(255,255,255,0.05); border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 0.9rem; color: var(--text); outline: none; direction: ltr; transition: border-color .2s; width: 100%; min-width: 0; }
    .form-in:focus { border-color: var(--p1); }
    .form-in::-webkit-inner-spin-button, .form-in::-webkit-outer-spin-button { -webkit-appearance: none; }
    .form-in[type=number] { -moz-appearance: textfield; }

    .toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(55px);
      background: rgba(4, 16, 6, 0.97);
      border: 1px solid var(--border);
      border-radius: 11px; padding: 10px 20px;
      font-size: 0.84rem; font-weight: 500;
      z-index: 9999; opacity: 0; pointer-events: none;
      transition: transform .3s, opacity .3s;
      white-space: nowrap;
      box-shadow: 0 8px 28px rgba(0,0,0,0.5);
    }
    .toast.on  { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.ok  { border-color: rgba(0,230,118,.4);  color: #69f0ae; }
    .toast.err { border-color: rgba(239,68,68,.4);  color: #f87171; }
  </style>
</head>

    return p1[keyOut] + slope * (inputVal - p1[keyIn]);
  }

  const round2 = n => Math.round(n * 100) / 100;

  const coinsIn  = document.getElementById('coinsIn');
  const amountIn = document.getElementById('amountIn');

  coinsIn.addEventListener('input', () => {
    const v = parseFloat(coinsIn.value);
    if (isNaN(v) || v <= 0) { amountIn.value = ''; return; }
    const r = linearInterp(entries, 'coins', 'price', v);
    amountIn.value = r !== null && r > 0 ? round2(r) : '';
  });

  amountIn.addEventListener('input', () => {
    const v = parseFloat(amountIn.value);
    if (isNaN(v) || v <= 0) { coinsIn.value = ''; return; }
    const r = linearInterp(entries, 'price', 'coins', v);
    coinsIn.value = r !== null && r > 0 ? round2(r) : '';
  });
</script>
</body>
